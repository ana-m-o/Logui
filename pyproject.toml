[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logui"
version = "0.2.0.dev11"
description = "Distraction-free daily planner app for the terminal."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Ana M", email = "dev@logui.local"},
]
keywords = ["tui", "productivity", "tasks", "events", "journal", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "textual>=0.50.0",
    "cryptography>=41.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
logui = "logui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logui"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.envs.default.scripts]
app = "python -m logui.main"
test = "pytest {args:tests}"
cov = "pytest --cov=src/logui --cov-report=term-missing {args:tests}"
lint = "ruff check src tests"
format = "ruff check --fix src tests && ruff format src tests"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
